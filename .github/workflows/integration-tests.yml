name: Integration tests

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  integration:
    # Only run when the necessary secrets are set in the repository
    if: ${{ secrets.OPENAI_API_KEY != '' && secrets.SUPABASE_URL != '' && secrets.SUPABASE_KEY != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Integration workflow may need full deps, but prefer CI requirements to avoid heavy optional deps.
          if [ -f backend/requirements-ci.txt ]; then
            pip install -r backend/requirements-ci.txt
          elif [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
      - name: Download spaCy model if available
        run: |
          python -c "import importlib,sys
try:
    importlib.import_module('spacy')
    import subprocess
    subprocess.run([sys.executable, '-m', 'spacy', 'download', 'en_core_web_sm'], check=True)
    print('Downloaded en_core_web_sm')
except Exception:
    print('spaCy not installed; skipping model download')
"

      - name: Run integration tests
        env:
          PYTHONPATH: backend
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Run only tests explicitly marked as integration
          pytest -q -m integration
