name: Python tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Ensure CI runs deterministically when secrets are not provided
      OPENAI_API_KEY: ""
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      # Ensure tests import the backend `app` package
      PYTHONPATH: backend
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Prefer a small CI requirements file to keep installs fast and reliable.
          if [ -f backend/requirements-ci.txt ]; then
            pip install -r backend/requirements-ci.txt
          elif [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
      - name: Download spaCy model if available
        run: |
          # If spaCy was installed by requirements, download the small English model
          python -c "import importlib,sys
try:
    importlib.import_module('spacy')
    print('spacy installed; downloading en_core_web_sm')
    import subprocess
    subprocess.run([sys.executable, '-m', 'spacy', 'download', 'en_core_web_sm'], check=True)
except Exception:
    print('spaCy not installed; skipping model download')
"

      - name: Run tests (unit)
        run: |
          # Skip integration tests (marked) to keep unit workflow fast and deterministic
          pytest -q -m "not integration"
