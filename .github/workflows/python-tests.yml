name: Python tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Prefer a small CI requirements file to keep installs fast and reliable.
          if [ -f backend/requirements-ci.txt ]; then
            pip install -r backend/requirements-ci.txt
          elif [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

      - name: Run tests (unit)
        env:
          # Ensure PYTHONPATH points at backend so `app` imports resolve
          PYTHONPATH: backend
        run: |
          # Skip integration tests (marked) to keep unit workflow fast and deterministic
          pytest -q -m "not integration"
